<!-- Root-relative so the page still styles when served for a nested missing path -->
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/site.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 40px var(--gutter); text-align: center; }
  .notfound { max-width: 560px; }
  .notfound .plaque { --plaque-size: clamp(150px, 30vw, 210px); margin: 0 auto 40px; box-shadow: inset 0 0 0 calc(var(--plaque-size) * 0.024) var(--c-plaque), inset 0 0 0 calc(var(--plaque-size) * 0.034) var(--c-charcoal), 0 18px 40px -18px rgba(0, 0, 0, 0.55); }
  .notfound h1 { margin: 0 0 18px; font-size: clamp(42px, 4.4vw + 24px, 88px); font-weight: 600; font-variation-settings: "opsz" 144; line-height: 0.98; letter-spacing: -0.032em; color: var(--c-on-wall); }
  .notfound p:not(.label) { max-width: 42ch; margin: 0 auto 36px; color: var(--c-on-wall); }
</style>
</head>
<body class="wall on-wall">
  <main class="notfound">
    <div class="plaque" role="img" aria-label="The Skin Den by Rachel">
      <svg class="plaque__mark" aria-hidden="true" focusable="false"><use href="/brand_assets/logo.svg#stack"/></svg>
      <span class="plaque__by" aria-hidden="true">-By Rachel-</span>
    </div>
    <p class="label">Lost the path</p>
    <h1>This page isn’t here.</h1>
    <p>The link you followed has either moved or never existed. No drama — take the door back to the studio.</p>
    <a class="btn btn--light" href="/">Back to The Skin Den</a>
  </main>
</body>
