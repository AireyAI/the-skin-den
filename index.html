<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0F0C08; color: var(--c-ivory);
    font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative; display: grid; place-items: center; overflow: hidden;
    min-height: 100vh; min-height: 100dvh;
  }
  .stage__bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 55%; }
  .stage__veil {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 50% at 50% 52%, rgba(15, 12, 8, 0.55) 0%, rgba(15, 12, 8, 0.72) 100%),
      linear-gradient(180deg, rgba(15, 12, 8, 0.45) 0%, rgba(15, 12, 8, 0.35) 35%, rgba(15, 12, 8, 0.65) 100%);
  }
  .stage__content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: clamp(20px, 3vw, 32px);
    max-width: 900px; padding: 88px clamp(24px, 6vw, 80px) 72px; text-align: center;
  }
  .eyebrow { margin: 0; font: 600 13px/1.4 var(--font-sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--c-gold); }
  /* Brand plaque: the one signature entrance on the site */
  .plaque {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    width: clamp(168px, 20vw, 220px); height: clamp(168px, 20vw, 220px); border-radius: 50%;
    background: var(--c-cream); border: 2px solid var(--c-charcoal);
    box-shadow: inset 0 0 0 12px var(--c-cream), inset 0 0 0 13px var(--c-charcoal), 0 32px 64px -20px rgba(0, 0, 0, 0.6);
    font-family: var(--font-serif); line-height: 0.96; color: var(--c-charcoal); text-align: center;
  }
  .plaque__top { padding-top: 6px; font-size: clamp(26px, 3vw, 34px); font-weight: 600; letter-spacing: -0.015em; }
  .plaque__big { margin-top: -6px; font-size: clamp(36px, 4vw, 48px); font-weight: 700; letter-spacing: -0.025em; }
  .plaque__sub { margin-top: 8px; font-size: clamp(11px, 1vw, 13px); font-style: italic; letter-spacing: 0.22em; text-transform: uppercase; color: var(--c-gold-text); }
  .tagline {
    max-width: 22ch; margin: 0;
    font: 400 clamp(32px, 4.5vw, 56px)/1.06 var(--font-serif); letter-spacing: -0.02em;
    color: var(--c-ivory); text-shadow: 0 2px 24px rgba(0, 0, 0, 0.4); text-wrap: balance;
  }
  .tagline em { font-style: italic; color: var(--c-gold); }
  .enter {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 56px; padding: 0 32px; margin-top: 8px; border-radius: 999px;
    background: var(--c-gold); color: var(--c-charcoal);
    font: 500 16px/1 var(--font-sans); letter-spacing: 0.01em; text-decoration: none;
    box-shadow: 0 16px 40px -12px rgba(197, 160, 109, 0.5);
    transition: background-color 150ms var(--ease), color 150ms var(--ease);
  }
  .enter:hover { background: var(--c-ivory); }
  .skip {
    position: absolute; top: 16px; right: 16px; z-index: 2;
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px;
    border: 1px solid rgba(253, 248, 238, 0.3); border-radius: 999px;
    background: rgba(15, 12, 8, 0.4); color: rgba(253, 248, 238, 0.85);
    font: 500 14px/1 var(--font-sans); text-decoration: none;
    transition: color 150ms var(--ease), border-color 150ms var(--ease);
  }
  .skip:hover { color: var(--c-ivory); border-color: rgba(253, 248, 238, 0.6); }
  .audio-note {
    position: absolute; left: 24px; bottom: calc(24px + var(--safe-bottom)); z-index: 1;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(253, 248, 238, 0.6);
  }
  .audio-note .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-gold); }
  :focus:not(:focus-visible) { outline: none; }
  :focus-visible { outline: 2px solid var(--c-ivory); outline-offset: 4px; }
  @media (max-width: 540px) { .audio-note { display: none; } }

  /* Entrance: plaque settles, then copy and the Enter button (all visible by ~0.6s) */
  @keyframes plaqueIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .plaque { animation: plaqueIn 500ms var(--ease) both; }
  .eyebrow { animation: fadeUp 400ms var(--ease) 60ms both; }
  .tagline { animation: fadeUp 400ms var(--ease) 120ms both; }
  .enter { animation: fadeUp 400ms var(--ease) 180ms both; }
  @media (prefers-reduced-motion: reduce) {
    .plaque, .eyebrow, .tagline, .enter { animation: none; }
    .enter, .skip { transition: none; }
  }
</style>
</head>
<body>

<header>
  <a class="skip" href="studio.html">Skip intro →</a>
</header>

<main class="stage">
  <picture>
    <source type="image/webp" srcset="brand_assets/clinic-room.webp">
    <img class="stage__bg" src="brand_assets/clinic-room.jpg" width="942" height="1660" alt="" fetchpriority="high">
  </picture>
  <div class="stage__veil"></div>
  <div class="stage__content">
    <p class="eyebrow">A studio in Carlisle</p>
    <div class="plaque" aria-hidden="true">
      <span class="plaque__top">The Skin</span>
      <span class="plaque__big">Den</span>
      <span class="plaque__sub">· by rachel ·</span>
    </div>
    <h1 class="tagline">
      Every appointment,<br>
      <em>tailored to you.</em>
    </h1>
    <a class="enter" href="studio.html" id="enter-cta">Enter the studio</a>
  </div>
  <div class="audio-note" aria-hidden="true">
    <span class="dot"></span>
    <span>The studio · Carlisle</span>
  </div>
</main>

</body>
</html>
